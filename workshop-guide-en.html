<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agents, MCP &amp; Real Work — Workshop Guide</title>
<style>
  :root{
    --bg:#FAFAFC;
    --ink:#132238;
    --ink-soft:#1E3350;
    --text:#1A2334;
    --muted:#5B6676;
    --line:#E6E8EE;
    --accent:#3457D5;
    --accent-weak:#EAEEFC;
    --done:#1A9E6B;
    --warn:#D27A1E;
    --term:#0F1B2D;
    --term-text:#D8E2F2;
    --radius:5px;
    --maxw:760px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:16px; line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:18px;
    padding:14px 24px; background:var(--ink); color:#fff;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .brand{display:flex; flex-direction:column; min-width:0}
  .brand b{font-weight:700; font-size:15.5px; letter-spacing:-.01em; white-space:nowrap}
  .brand span{font-size:12.5px; color:#9fb0c9}
  .progress{margin-left:auto; display:flex; align-items:center; gap:12px; flex-shrink:0}
  .progress .count{font-size:12.5px; color:#b9c6da; font-variant-numeric:tabular-nums}
  .bar{width:120px; height:6px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden}
  .bar > i{display:block; height:100%; width:0%; background:var(--done); transition:width .35s ease}
  .wrap{display:grid; grid-template-columns:272px 1fr; align-items:start}
  .spine{
    position:sticky; top:57px; align-self:start;
    height:calc(100vh - 57px); overflow:auto;
    padding:22px 14px 40px; border-right:1px solid var(--line);
  }
  .spine h2{font-size:12px; font-weight:600; color:var(--muted); margin:0 10px 10px; letter-spacing:.02em}
  .nav{list-style:none; margin:0 0 20px; padding:0}
  .nav li{margin:1px 0}
  .nav button{
    width:100%; display:flex; align-items:center; gap:11px;
    background:none; border:none; cursor:pointer; text-align:left;
    padding:8px 10px; border-radius:var(--radius); color:var(--text);
    font-family:inherit; font-size:15px; line-height:1.3;
  }
  .nav button:hover{background:#F0F2F7}
  .nav button.active{background:var(--accent-weak); color:var(--accent); font-weight:600}
  .nav .num{
    flex-shrink:0; width:24px; height:24px; border-radius:6px;
    display:grid; place-items:center; font-size:12.5px; font-weight:600;
    background:#EDEFF4; color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .nav button.active .num{background:var(--accent); color:#fff}
  .nav li.complete .num{background:var(--done); color:#fff}
  .nav li.complete button.active .num{background:var(--done)}
  .nav .label{min-width:0}
  .nav .tick{margin-left:auto; color:var(--done); font-size:13px; opacity:0; flex-shrink:0}
  .nav li.complete .tick{opacity:1}
  main{padding:40px 32px 120px}
  .panel{display:none; max-width:var(--maxw); margin:0 auto}
  .panel.active{display:block; animation:fade .3s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  .eyebrow{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; margin-bottom:10px}
  .eyebrow .chip{
    display:inline-grid; place-items:center; min-width:26px; height:26px; padding:0 7px;
    border-radius:6px; background:var(--ink); color:#fff; font-weight:700; font-size:13px;
    font-variant-numeric:tabular-nums;
  }
  h1.mt{font-size:34px; line-height:1.1; letter-spacing:-.02em; margin:.1em 0 .35em; font-weight:750}
  .lede{font-size:18px; color:#33415a; margin:0 0 28px}
  h3{font-size:19px; letter-spacing:-.01em; margin:34px 0 8px; font-weight:680}
  p{margin:12px 0}
  a{color:var(--accent)}
  .why{border-left:3px solid var(--accent); background:#F5F7FE; padding:14px 18px; border-radius:0 var(--radius) var(--radius) 0; margin:20px 0}
  .why b{color:var(--ink)}
  .say{border-left:3px solid var(--done); background:#F2FAF6; padding:12px 18px; border-radius:0 var(--radius) var(--radius) 0; margin:18px 0; font-size:15px}
  .say .k{display:block; font-size:12.5px; font-weight:600; color:var(--done); margin-bottom:3px}
  .cmd{position:relative; margin:16px 0}
  .cmd pre{
    margin:0; background:var(--term); color:var(--term-text);
    border-radius:var(--radius); padding:16px 54px 16px 18px; overflow:auto;
    font-family:var(--mono); font-size:13.3px; line-height:1.6;
  }
  .cmd.prompt pre{white-space:pre-wrap; word-break:break-word}
  .copy{
    position:absolute; top:10px; right:10px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#cdd8ea;
    font-family:inherit; font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer;
  }
  .copy:hover{background:rgba(255,255,255,.14)}
  .copy.ok{color:#8ff0c2; border-color:rgba(143,240,194,.4)}
  .cmd-cap{font-size:13px; color:var(--muted); margin:0 0 4px}
  .check{border:1px solid var(--line); border-radius:var(--radius); padding:6px 18px 10px; margin:24px 0}
  .check > .h{font-size:13px; font-weight:600; color:var(--muted); margin:10px 0 4px}
  .check label{display:flex; gap:11px; align-items:flex-start; padding:7px 0; cursor:pointer; font-size:15.5px}
  .check input{margin-top:4px; width:17px; height:17px; accent-color:var(--done); flex-shrink:0; cursor:pointer}
  .check label.done{color:var(--muted)}
  .check label.done .lt{text-decoration:line-through}
  ul.clean{margin:12px 0; padding-left:20px}
  ul.clean li{margin:6px 0}
  .kv{font-family:var(--mono); font-size:13px; background:#EDEFF4; padding:1px 6px; border-radius:4px}
  .foot{display:flex; justify-content:space-between; gap:12px; margin-top:44px; padding-top:20px; border-top:1px solid var(--line)}
  .foot button{font-family:inherit; font-size:14.5px; padding:10px 16px; border-radius:var(--radius); border:1px solid var(--line); background:#fff; color:var(--text); cursor:pointer}
  .foot button:hover:not(:disabled){border-color:#c4ccda}
  .foot button.next{background:var(--accent); color:#fff; border-color:var(--accent); margin-left:auto}
  .foot button:disabled{opacity:.4; cursor:default}
  .hero{display:flex; gap:28px; align-items:center; flex-wrap:wrap; margin:6px 0 28px}
  .loopfig{flex:0 0 220px}
  @media (prefers-reduced-motion:no-preference){ .pulse{animation:pulse 2.4s ease-in-out infinite} }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  table{border-collapse:collapse; width:100%; margin:16px 0; font-size:14.5px}
  th,td{text-align:left; vertical-align:top; padding:9px 12px; border-bottom:1px solid var(--line)}
  th{font-size:12.5px; color:var(--muted); font-weight:600}
  td code,.kv{font-family:var(--mono)}
  details{border-bottom:1px solid var(--line); padding:4px 0}
  summary{cursor:pointer; padding:12px 2px; font-weight:600; font-size:16px; list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+"; color:var(--accent); font-weight:700; margin-right:10px}
  details[open] summary::before{content:"–"}
  details .a{padding:0 2px 14px; color:#39465c}
  .warn-accent{--accent:var(--warn); --accent-weak:#FBF1E4}
  @media (max-width:880px){
    .wrap{grid-template-columns:1fr}
    .spine{position:sticky; top:57px; height:auto; display:flex; gap:6px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); padding:10px 12px}
    .spine h2{display:none}
    .nav{display:flex; margin:0}
    .nav button{white-space:nowrap}
    .nav .label{display:none}
    .nav .tick{display:none}
    main{padding:28px 20px 100px}
    h1.mt{font-size:28px}
    .brand span{display:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <b>AI Agents, MCP &amp; Real Work</b>
    <span>Workshop guide — step through it at your own pace</span>
  </div>
  <div class="progress">
    <span class="count" id="count">0 / 0 done</span>
    <div class="bar"><i id="barfill"></i></div>
  </div>
</div>

<div class="wrap">
  <aside class="spine">
    <h2>Contents</h2>
    <ul class="nav" id="nav"></ul>
  </aside>
  <main id="main"></main>
</div>

<script>
const term = (s)=>s.replace(/</g,"&lt;");

const modules = [
  {
    id:"intro", num:"0", title:"Intro &amp; theory", sub:"The big picture — why all this.",
    html:`
      <div class="hero">
        <div class="loopfig">
          <svg viewBox="0 0 220 200" width="220" height="200" role="img" aria-label="Agent loop">
            <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#3457D5"/></marker></defs>
            <circle cx="110" cy="100" r="74" fill="none" stroke="#E6E8EE" stroke-width="2"/>
            <path d="M110 30 A74 74 0 0 1 174 138" fill="none" stroke="#3457D5" stroke-width="2" marker-end="url(#ah)"/>
            <path d="M174 138 A74 74 0 0 1 46 138" fill="none" stroke="#3457D5" stroke-width="2" marker-end="url(#ah)"/>
            <path d="M46 138 A74 74 0 0 1 110 30" fill="none" stroke="#3457D5" stroke-width="2" marker-end="url(#ah)"/>
            <g font-family="ui-sans-serif,system-ui" font-size="13" font-weight="600" text-anchor="middle" fill="#132238">
              <circle class="pulse" cx="110" cy="30" r="6" fill="#3457D5"/><text x="110" y="18">think</text>
              <circle cx="174" cy="138" r="6" fill="#132238"/><text x="183" y="162">act</text>
              <circle cx="46" cy="138" r="6" fill="#132238"/><text x="40" y="162">observe</text>
            </g>
          </svg>
        </div>
        <div style="flex:1; min-width:240px">
          <div class="eyebrow"><span class="chip">0</span> Intro &amp; theory</div>
          <h1 class="mt">Turn an assistant that suggests into one that acts.</h1>
          <p class="lede">Today you'll build an AI agent that reads issues, opens pull requests, and clicks through your app like a real user — not a coding shortcut, but a teammate.</p>
        </div>
      </div>

      <h3>Agentic coding and the agent loop</h3>
      <p>A classic assistant <b>suggests</b> code — you accept or reject it. An agentic assistant gets a <b>goal</b> and decides the steps itself. It runs in a loop:</p>
      <p style="font-family:var(--mono); font-size:13.5px; background:#EDEFF4; padding:12px 14px; border-radius:5px">goal → think → use a tool → check the result → iterate → done</p>
      <p>Say "fix the login bug" and the agent <b>reads</b> the files, <b>finds</b> the problem, <b>edits</b> the code, <b>runs</b> the tests, and if they fail it tries again — without you dictating each step.</p>

      <h3>Claude Code</h3>
      <p>Our primary tool. It brings that agent loop right into your terminal (or VS Code). It has real access to your files, can run commands, and connects to external tools via MCP. It runs on <b>Node.js 18+</b> and a <b>paid plan</b> or API credits — the free plan won't run it.</p>

      <h3>MCP — Model Context Protocol</h3>
      <p>Before, every connection between an AI and a tool (GitHub, a database, Figma…) had to be built separately. MCP is an <b>open standard</b> that gives AI apps and tools one shared language.</p>
      <div class="why"><b>Analogy:</b> MCP is like <b>USB-C for AI</b> — one connector you plug anything into, instead of a different cable for every device.</div>
      <ul class="clean">
        <li><b>Host</b> — the app you work in (Claude Code).</li>
        <li><b>Server</b> — a program that exposes capabilities (GitHub, Playwright…).</li>
        <li><b>Tools / Resources / Prompts</b> — actions the model calls · data it can read · ready-made templates.</li>
      </ul>
      <div class="say"><span class="k">The takeaway</span>MCP isn't just another feature — it's an infrastructural shift. A standard that changes the rules, and the server ecosystem is growing fast: GitHub, Figma, Postgres, Jira, Playwright.</div>
    `
  },
  {
    id:"prereq", num:"✓", title:"Prerequisites", sub:"What to have ready before you start.",
    html:`
      <div class="eyebrow"><span class="chip">✓</span> Prerequisites</div>
      <h1 class="mt">Before you start</h1>
      <p class="lede">Check that this is all working. If anything's missing, see the setup guide or ask the instructor.</p>
      <div class="check" data-mod="prereq">
        <label><input type="checkbox"><span class="lt">Node.js 18+ (check with <span class="kv">node --version</span>)</span></label>
        <label><input type="checkbox"><span class="lt">Claude Code installed and authenticated (<span class="kv">claude --version</span>, then <span class="kv">claude</span>)</span></label>
        <label><input type="checkbox"><span class="lt">A clean test GitHub repo with 1–2 open issues</span></label>
        <label><input type="checkbox"><span class="lt">A GitHub PAT available as <span class="kv">GITHUB_PAT</span></span></label>
        <label><input type="checkbox"><span class="lt">Playwright browsers (<span class="kv">npx playwright install</span>)</span></label>
      </div>
    `
  },
  {
    id:"m1", num:"1", title:"Build a demo app", sub:"Something real for the agent to act on.",
    html:`
      <div class="eyebrow"><span class="chip">1</span> Module 1</div>
      <h1 class="mt">Build something to work on</h1>
      <p class="lede">The agent needs something real. Have Claude Code generate a tiny page with an interaction that Playwright will later click through.</p>
      <div class="why">The <span class="kv">id</span> attributes are there on purpose — Playwright needs them in Module 4 to click reliably.</div>
      <p class="cmd-cap">Paste this prompt into Claude Code:</p>
      ${cmd(`Create a simple static web page as a single index.html file with the CSS inline in a <style> tag. No frameworks, no extra JavaScript beyond what's needed for the interaction below. Goal: it should serve as a demo that Playwright MCP will later open and click through.

Page content:
- An <h1> heading with the text "Workshop Demo".
- A short paragraph describing the page.
- A simple contact form with fields:
  - Name (input, id="name")
  - Email (input type email, id="email")
  - Message (textarea, id="message")
  - A "Submit" button (id="submit")
- When Submit is clicked, show a confirmation message (without a page reload, via a small bit of JS) in an element with id="confirmation", e.g. "Thank you, your message has been sent."

Design:
- Clean, minimalist CSS: centered content, a max-width container, readable font, subtle borders and padding on the form.
- No external resources (no CDN, fonts, or images) — everything offline in a single file.

At the end, tell me how to open/run the page locally.`, true)}
      <div class="say"><span class="k">That was the first agent loop</span>The model read the task, decided to create a file, and did it.</div>
      <div class="check" data-mod="m1">
        <div class="h">Checkpoint</div>
        <label><input type="checkbox"><span class="lt"><span class="kv">index.html</span> exists and opens in a browser</span></label>
        <label><input type="checkbox"><span class="lt">The form submits and shows the confirmation message</span></label>
        <label><input type="checkbox"><span class="lt">The <span class="kv">id</span> attributes are present</span></label>
      </div>
    `
  },
  {
    id:"m2", num:"2", title:"/grill-me", sub:"A rubber duck that bites back.",
    html:`
      <div class="eyebrow"><span class="chip">2</span> Module 2</div>
      <h1 class="mt">/grill-me — a rubber duck that bites back</h1>
      <p class="lede">Agentic workflows fall apart when the task is fuzzy. Your first custom command is a relentless interviewer that won't let you move on until the task is properly defined.</p>
      <h3>Create the slash command</h3>
      <p>Create <span class="kv">.claude/commands/grill-me.md</span> with instructions telling the agent to:</p>
      <ul class="clean">
        <li>ask questions one at a time, not all at once,</li>
        <li>not move on until inputs, outputs, edge cases, and acceptance criteria are clear,</li>
        <li>summarize the agreed task definition at the end.</li>
      </ul>
      <h3>Try it</h3>
      <p>Run <span class="kv">/grill-me</span> and give it a vague feature, e.g. "add search to the page". Let it interrogate you.</p>
      <div class="why">The exact format for skills vs. slash commands evolves — if something doesn't match, check the <a href="https://docs.claude.com/en/docs/claude-code/overview" target="_blank" rel="noopener">docs</a>.</div>
      <div class="check" data-mod="m2">
        <div class="h">Checkpoint</div>
        <label><input type="checkbox"><span class="lt"><span class="kv">/grill-me</span> actually pushes back and won't accept a half-baked task</span></label>
        <label><input type="checkbox"><span class="lt">It produces a clear task definition at the end</span></label>
      </div>
    `
  },
  {
    id:"m3", num:"3", title:"GitHub MCP", sub:"The whole dev loop without leaving the editor.",
    html:`
      <div class="eyebrow"><span class="chip">3</span> Module 3</div>
      <h1 class="mt">Wire up the GitHub MCP server</h1>
      <p class="lede">Now give the agent real context about your environment. Connect the GitHub server and watch it work the full development loop from the terminal.</p>
      <div class="why">GitHub officially recommends the <b>remote HTTP</b> server. The old npm package <span class="kv">@modelcontextprotocol/server-github</span> is deprecated.</div>
      <p class="cmd-cap">Add the server:</p>
      ${cmd(`claude mcp add --scope project --transport http github \\
  https://api.githubcopilot.com/mcp/ \\
  --header "Authorization: Bearer \${GITHUB_PAT}"`)}
      <p>Verify with <span class="kv">/mcp</span> — <span class="kv">github</span> should be "connected".</p>
      <h3>Have the agent run the full loop</h3>
      <ul class="clean">
        <li>Read the open issues in your repo.</li>
        <li>Pick one and make a small change (e.g. tweak the page from Module 1).</li>
        <li>Create a pull request.</li>
        <li>Add a comment on the code review.</li>
      </ul>
      <div class="check" data-mod="m3">
        <div class="h">Checkpoint</div>
        <label><input type="checkbox"><span class="lt">Agent read issues from the repo</span></label>
        <label><input type="checkbox"><span class="lt">Agent created a PR</span></label>
        <label><input type="checkbox"><span class="lt">Agent commented on a review — without touching the GitHub UI</span></label>
      </div>
    `
  },
  {
    id:"m4", num:"4", title:"Playwright MCP", sub:"The agent uses the app like a user.",
    html:`
      <div class="eyebrow"><span class="chip">4</span> Module 4</div>
      <h1 class="mt">Playwright MCP — use the app like a real user</h1>
      <p class="lede">"Works on my machine" ends here. The agent navigates your app like a person — clicking, taking screenshots, catching what only shows up in real use.</p>
      <p class="cmd-cap">Add the server:</p>
      ${cmd(`claude mcp add --scope project playwright -- npx -y @playwright/mcp@latest`)}
      <p>Verify with <span class="kv">/mcp</span>. Work through the three passes in order.</p>

      <h3>4a — Happy path</h3>
      ${cmd(`Open the index.html file in the browser via Playwright. Fill in the form with test data:
name "John Smith", email "john@example.com", message "This is a test message".
Click the Submit button (id="submit"). Verify that the confirmation message appears
in the element with id="confirmation". Take a screenshot of the resulting page and tell me what you saw.`, true)}

      <h3>4b — Error state</h3>
      ${cmd(`Open index.html via Playwright. Try to submit the form in ways that test error states:
1. Leave the email field empty and click Submit — check how the page behaves.
2. Enter an invalid email (e.g. "abc") and click Submit — check whether the browser or the
   page shows a validation error.
After each attempt take a screenshot and describe what happened. At the end, tell me whether
the page behaves as it should and what could be improved.`, true)}

      <h3>4c — Full QA pass</h3>
      ${cmd(`Take index.html and run a full QA pass via Playwright as a real user would:
1. Open the page and take a screenshot of the initial state.
2. Check that all elements are present: heading, form, name/email/message fields, Submit button.
3. Test the happy path — fill in valid data, submit, verify the confirmation message, screenshot.
4. Test the error state — empty or invalid email, verify the behavior, screenshot.
5. Give me a short report: what works, what doesn't, and a list of issues found with recommendations.
Work step by step and after each step tell me what you did.`, true)}
      <div class="why">Tip: add <span class="kv">--save-video</span> to the Playwright server to record the whole run as a video.</div>
      <div class="check" data-mod="m4">
        <div class="h">Checkpoint</div>
        <label><input type="checkbox"><span class="lt">Agent navigated the page and produced screenshots</span></label>
        <label><input type="checkbox"><span class="lt">Agent detected the error-state behavior on its own</span></label>
        <label><input type="checkbox"><span class="lt">Agent produced a QA report</span></label>
      </div>
    `
  },
  {
    id:"m5", num:"5", title:"Where it breaks", sub:"Understand the limits, not just the wins.", warn:true,
    html:`
      <div class="eyebrow"><span class="chip" style="background:var(--warn)">5</span> Module 5</div>
      <h1 class="mt">Where it breaks</h1>
      <p class="lede">Real-world adoption means understanding the limits. Break things on purpose and learn to fix them — that's the real skill.</p>
      <p><b>Trigger at least two and recover from each:</b></p>
      <ul class="clean">
        <li><span class="kv">command not found: npx</span> — a Node / PATH problem (common in WSL)</li>
        <li>MCP server won't start — a config typo or <span class="kv">GITHUB_PAT</span> not set</li>
        <li>GitHub PAT lacking permissions — the agent can't create a PR</li>
        <li>Playwright without browsers — fails on navigation</li>
        <li>The agent loops / does something destructive — how to stop it (<span class="kv">Esc</span>) and roll back with git</li>
      </ul>
      <p>For each, write down <b>how you recognized it</b> (the error) and <b>how you fixed it</b>.</p>
      <div class="check" data-mod="m5">
        <div class="h">Checkpoint</div>
        <label><input type="checkbox"><span class="lt">I triggered and fixed at least 2 failures</span></label>
        <label><input type="checkbox"><span class="lt">I can stop the agent (<span class="kv">Esc</span>) and roll back with git</span></label>
      </div>
      <div class="say"><span class="k">Done — what you built</span>A plain assistant became a tool that reasons through a problem, makes decisions, and executes across your toolchain. The same patterns apply to Figma, Postgres, Jira — and to Copilot and Cursor.</div>
    `
  },
  {
    id:"cheat", num:"⌘", title:"Cheat sheet", sub:"Every command in one place.",
    html:`
      <div class="eyebrow"><span class="chip">⌘</span> Cheat sheet</div>
      <h1 class="mt">Every command in one place</h1>
      <p class="cmd-cap">Setup</p>
      ${cmd(`node --version
npm install -g @anthropic-ai/claude-code
claude --version
claude`)}
      <p class="cmd-cap">GitHub PAT</p>
      ${cmd(`export GITHUB_PAT=ghp_xxx`)}
      <p class="cmd-cap">MCP servers</p>
      ${cmd(`claude mcp add --scope project --transport http github \\
  https://api.githubcopilot.com/mcp/ \\
  --header "Authorization: Bearer \${GITHUB_PAT}"

claude mcp add --scope project playwright -- npx -y @playwright/mcp@latest

npx playwright install`)}
      <p class="cmd-cap">In Claude Code</p>
      ${cmd(`/mcp        # list servers and their status
/grill-me   # our custom command
Esc         # stop a running agent`)}
      <p class="cmd-cap">Git rescue</p>
      ${cmd(`git status
git checkout -- .      # discard local changes
git reset --hard HEAD  # hard reset (careful!)`)}
      <p class="cmd-cap">.mcp.json (in the repo root; tokens via env)</p>
      ${cmd(`{
  "mcpServers": {
    "github": {
      "type": "http",
      "url": "https://api.githubcopilot.com/mcp/",
      "headers": { "Authorization": "Bearer \${GITHUB_PAT}" }
    },
    "playwright": {
      "command": "npx",
      "args": ["-y", "@playwright/mcp@latest"]
    }
  }
}`)}
    `
  },
  {
    id:"faq", num:"?", title:"FAQ &amp; fixes", sub:"Questions and quick troubleshooting.",
    html:`
      <div class="eyebrow"><span class="chip">?</span> FAQ &amp; troubleshooting</div>
      <h1 class="mt">When something fails or you're unsure</h1>

      <h3>Frequently asked</h3>
      <details><summary>Is it free?</summary><div class="a">The account and install are. Using Claude Code isn't — you need a paid plan (Pro from ~$20/mo) or API credits. Closest to free is a Console account with trial credits (~$5, no card), good for a few sessions.</div></details>
      <details><summary>Terminal or VS Code?</summary><div class="a">Either — it's the same Claude Code. The VS Code extension (publisher Anthropic, verified checkmark) gives you a panel in the editor; the CLI is a reliable fallback. Both need the CLI under the hood and a paid plan.</div></details>
      <details><summary>Is it safe to give the agent GitHub access?</summary><div class="a">Use a PAT with minimal scope, on a test repo. Never hardcode the token into files — use <span class="kv">GITHUB_PAT</span>. You can revoke it anytime on GitHub.</div></details>
      <details><summary>What if the agent does something dumb?</summary><div class="a">That's why we work on a test repo and use git. Stop it with <span class="kv">Esc</span>. Roll back with <span class="kv">git checkout</span> / <span class="kv">git reset</span>.</div></details>
      <details><summary>Does this work with Copilot / Cursor?</summary><div class="a">Yes. MCP is an open standard, so the same servers and patterns run across agent-capable tools. The surface changes, not the principle.</div></details>

      <h3>Quick troubleshooting</h3>
      <table>
        <tr><th>Symptom</th><th>Fix</th></tr>
        <tr><td><code>command not found: npx</code></td><td>Install Node 18+; in WSL install Node inside WSL</td></tr>
        <tr><td>Claude Code won't authenticate</td><td>Check paid plan / credits; sign in again</td></tr>
        <tr><td>Server not "connected" in <code>/mcp</code></td><td>Check config, <code>echo $GITHUB_PAT</code>, restart the session</td></tr>
        <tr><td>Agent can't create a PR</td><td>PAT with repo/issues/PR scope; set it again</td></tr>
        <tr><td>Playwright fails on navigation</td><td><code>npx playwright install</code></td></tr>
        <tr><td>Agent loops</td><td><code>Esc</code>; roll back with git; make the task more specific</td></tr>
      </table>
      <p style="margin-top:22px; color:var(--muted); font-size:14px">This moves fast — verify in the <a href="https://docs.claude.com/en/docs/claude-code/overview" target="_blank" rel="noopener">Claude Code docs</a> and at <a href="https://modelcontextprotocol.io" target="_blank" rel="noopener">modelcontextprotocol.io</a>.</p>
    `

function cmd(text, isPrompt){
  return `<div class="cmd ${isPrompt?'prompt':''}">
    <button class="copy" type="button">Copy</button>
    <pre>${term(text)}</pre>
  </div>`;
}

const nav = document.getElementById('nav');
const main = document.getElementById('main');
let current = 0;

modules.forEach((m,i)=>{
  const li = document.createElement('li');
  li.dataset.mod = m.id;
  li.innerHTML = `<button data-i="${i}">
      <span class="num">${m.num}</span>
      <span class="label">${m.title}</span>
      <span class="tick">✓</span>
    </button>`;
  nav.appendChild(li);

  const panel = document.createElement('section');
  panel.className = 'panel' + (m.warn?' warn-accent':'');
  panel.id = 'panel-'+m.id;
  panel.innerHTML = m.html + footNav(i);
  main.appendChild(panel);
});

function footNav(i){
  const prev = i>0 ? `<button class="prev" data-i="${i-1}">← Back</button>` : `<span></span>`;
  const next = i<modules.length-1 ? `<button class="next" data-i="${i+1}">Next →</button>` : `<span></span>`;
  return `<div class="foot">${prev}${next}</div>`;
}

function show(i){
  current = i;
  document.querySelectorAll('.panel').forEach((p,idx)=>p.classList.toggle('active', idx===i));
  document.querySelectorAll('.nav button[data-i]').forEach(b=>b.classList.toggle('active', +b.dataset.i===i));
  window.scrollTo({top:0, behavior:'smooth'});
}

document.addEventListener('click', (e)=>{
  const navBtn = e.target.closest('.nav button[data-i]');
  if(navBtn){ show(+navBtn.dataset.i); return; }
  const foot = e.target.closest('.foot button[data-i]');
  if(foot){ show(+foot.dataset.i); return; }
  const cp = e.target.closest('.copy');
  if(cp){ copy(cp); return; }
});

function copy(btn){
  const text = btn.parentElement.querySelector('pre').innerText;
  const done = ()=>{ btn.textContent='Copied ✓'; btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('ok'); }, 1600); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text, done); }
}
function fallback(text, done){
  const ta=document.createElement('textarea'); ta.value=text;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
  ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); done();
}

function refresh(){
  const boxes = [...document.querySelectorAll('.check input[type=checkbox]')];
  const total = boxes.length;
  const done = boxes.filter(b=>b.checked).length;
  document.getElementById('count').textContent = `${done} / ${total} done`;
  document.getElementById('barfill').style.width = total? (done/total*100)+'%' : '0%';
  document.querySelectorAll('.check[data-mod]').forEach(c=>{
    const b=[...c.querySelectorAll('input')];
    const all=b.length>0 && b.every(x=>x.checked);
    const li=document.querySelector(`.nav li[data-mod="${c.dataset.mod}"]`);
    if(li) li.classList.toggle('complete', all);
  });
}
document.addEventListener('change', (e)=>{
  if(e.target.matches('.check input')){
    const lbl=e.target.closest('label'); if(lbl) lbl.classList.toggle('done', e.target.checked);
    refresh();
  }
});

show(0); refresh();
</script>
</body>
</html>
